  baseline_plan_before:
    name: baseline-plan-before sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample:
          - 1
          - 2
          - 3
        variant:
          - baseline-plan-before
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: ./.github/actions/install-node-dependencies
      - name: Plan unit selection
        id: plan
        env:
          ORCA_UNIT_SELECTION_MODE: shadow
        run: |-
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; writeFileSync('config/scripts/.ci-unit-plan-before.mjs', readFileSync('config/scripts/ci-unit-plan.mjs','utf8').replace('graph: collectUnitDependencyGraph,','graph: collectUnitDependencyGraph(),'))"
          node config/scripts/.ci-unit-plan-before.mjs
          rm config/scripts/.ci-unit-plan-before.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ci-concurrency-${{ matrix.variant }}-${{ matrix.sample }}-attempt-${{ github.run_attempt }}
