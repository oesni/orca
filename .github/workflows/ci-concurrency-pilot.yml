          - plan
          - types
      - uses: actions/upload-artifact@v7
        with:
          name: ci-concurrency-${{ matrix.variant }}-${{ matrix.sample }}-attempt-${{ github.run_attempt }}
          path: ci-shards/unit-selection.json
          retention-days: 14
    if: false
  early_localization:
    name: early-localization sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample:
          - 1
          - 2
          - 3
        variant:
          - early-localization
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
