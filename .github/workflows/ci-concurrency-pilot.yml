          retention-days: 14
    if: false
  native_producer:
    name: native producer sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample:
          - 1
          - 2
          - 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: ./.github/actions/ci-native-cache-proof
        id: deps
        with:
          native-runtime: node
          node-version: '24'
      - name: Probe cached native runtime
        run: node config/scripts/ensure-native-runtime.mjs --check-only
      - name: Verify native cache provenance
        env:
          CACHE_HIT: ${{ steps.deps.outputs.native-cache-hit }}
        run: test "$CACHE_HIT" != true
    if: false
  native_consumer:
