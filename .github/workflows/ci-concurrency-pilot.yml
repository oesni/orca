        env:
          CACHE_HIT: ${{ steps.deps.outputs.native-cache-hit }}
        run: test "$CACHE_HIT" = true
    needs:
      - native_producer
    if: false
  controlled:
    name: controlled comparison cold ${{ matrix.cold }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cold:
          - 'false'
          - 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
