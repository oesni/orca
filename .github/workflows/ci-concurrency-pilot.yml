          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-
      - name: Compare on the same runner in both orders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCHMARK_COLD_TYPES: ${{ matrix.cold }}
          BENCHMARK_SAMPLES: '2'
        run: node config/scripts/ci-preflight-benchmark.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preflight-comparison-cold-${{ matrix.cold }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-comparison
          retention-days: 14
    if: false
  skipped_background:
    name: mobile-only background skips
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Skipped types
        id: types
        if: false
        background: true
        run: exit 9
      - name: Skipped plan
        id: plan
        if: false
        background: true
        run: exit 9
      - wait-all: null
      - name: Verify empty skipped outputs
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
        run: test -z "$SHARDS"
  early:
    name: early compiler sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
